[Settings]
stealth_mode = True
# 代理模式: 无代理, 代理池, 轮转代理, API提取
proxy_mode = 无代理
proxy_pool = 
# 轮转代理格式: http://user:pass@host:port
rotating_proxy = 
# 代理API提取地址，返回格式需为txt
proxy_api_url = 
# 目标注册地址
target_url = https://example.com/register
# 任务超时时间(分钟)
timeout_minutes = 10
# 邮箱池格式: 邮箱----密码----client_id----refresh_token
email_pool = 
# 是否跟随代理地区和时区
sync_proxy_locale = False
sync_proxy_timezone = False
sync_proxy_geolocation = False
# 是否自动绑定邀请码并创建API Key
auto_bind_create = False
# Microsoft OAuth2 Client Secret (Outlook 邮箱 API 密钥)，可在此配置全局默认，也支持在邮箱池行中配置为第5项
email_client_secret = 
